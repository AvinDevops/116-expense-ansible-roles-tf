- name: installing mysql server
  ansible.builtin.dnf:
    name: mysql-server
    state: installed

- name: starting and enabiling mysql server
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: installing python dependencies to connect mysql
  ansible.builtin.pip:
    name:
    - PyMySQL
    - cryptography
    executable: pip3.9 # if python is 3.11 we will install pip3.11

- name: check db connection
  community.mysql.mysql_info:
    login_user: root
    login_password: "{{mysql_root_password}}"
    login_host: "{{login_host}}"
    filter:
    - version
  ignore_errors: yes
  register: mysql_connection_output

- name: print output
  ansible.builtin.debug:
    msg: "{{mysql_connection_output}}"

- name: setting root passsword for mysql
  ansible.builtin.command: mysql_secure_installation --set-root-pass {{mysql_root_password}}
  when: mysql_connection_output.failed is true
